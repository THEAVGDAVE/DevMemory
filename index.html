<!doctype html>
<html>
    <head>
        <title>DevMemory-Knowlege Engine</title>
        <link rel="stylesheet" href="./static/style.css" />
    </head>
    <body>
        <h1>DevMemory</h1>
        <h2>Sign in to your memory bank</h2>
        <div class="first_div">
            <button class="button-1">Continue with GitHub</button>
            <button class="button-2">Continue with Google</button>
            <h5
                style="
                    color: #9ca3af;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: smaller;
                    font-weight: normal;
                "
            >
                OR CONTINUE WITH EMAIL
            </h5>

            <h5 class="h5-1" style="text-align: left">Email Address</h5>
            <div class="input">
                <span>✉</span>
                <input class="form-1" type="email" value="developer@example.com" />
            </div>
            <div class="row">
                <h5 class="h5-1" style="text-align: left">Password</h5>
                <a
                    href="youtube.com"
                    style="
                        font-family: Arial, Helvetica, sans-serif;
                        color: blueviolet;
                        font-weight: normal;
                        text-decoration: none;
                        font-size: small;
                    "
                    >Forgot password?</a
                >
            </div>
            <div class="input">
                <span>🔒</span>
                <input class="form-1" type="password" value="pasword 123" />
            </div>
            <button class="button-3">Sign In →</button>
            <h5 class="txt">
                Dont have an account?<a href="youtube.com" style="text-decoration: none; color: blueviolet"> Sign up</a>
            </h5>
        </div>
    </body>
</html>
